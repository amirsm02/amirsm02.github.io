<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Astrophotography by Amir Shapour Mohammadi. Explore galaxies, nebulae and the Solar System, with full-resolution images and capture details.">
  <title>Astrophotography | Amir Shapour Mohammadi</title>

  <style>
    :root {
      color-scheme: dark;
      --bg: #0d0d0d;
      --panel: #151515;
      --text: #f2f2f2;
      --muted: #a8a8a8;
      --line: #4a4a4a;
      --accent: #0f4567;
      --gap: 12px;
    }

    * { box-sizing: border-box; }

    html { scroll-behavior: smooth; }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: Arial, Helvetica, sans-serif;
    }

    button, input { font: inherit; }

    .site-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      padding: 18px clamp(12px, 2vw, 28px);
      border-bottom: 1px solid #242424;
    }

    .site-header h1 {
      margin: 0;
      font-size: clamp(1.15rem, 2.2vw, 1.75rem);
      letter-spacing: .01em;
    }

    .home-link {
      color: var(--text);
      text-decoration: none;
    }

    .home-link:hover { text-decoration: underline; }

    .controls {
      position: sticky;
      top: 0;
      z-index: 20;
      padding: 15px clamp(10px, 1.5vw, 22px);
      background: rgba(13, 13, 13, .96);
      border-bottom: 1px solid #252525;
      backdrop-filter: blur(8px);
    }

    .filter-row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
    }

    .filter-button,
    .sort-button {
      min-height: 31px;
      padding: 5px 9px;
      color: var(--text);
      background: transparent;
      border: 1px solid #ddd;
      border-radius: 0;
      font-size: .78rem;
      font-weight: 700;
      cursor: pointer;
    }

    .filter-button:hover,
    .sort-button:hover,
    .filter-button.active,
    .sort-button.active {
      background: var(--accent);
      border-color: var(--accent);
    }

    .utility-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      margin-top: 13px;
    }

    .search {
      width: min(420px, 100%);
      padding: 9px 11px;
      color: var(--text);
      background: var(--panel);
      border: 1px solid #444;
      outline: none;
    }

    .search:focus { border-color: #ddd; }

    .sort-controls {
      display: flex;
      align-items: center;
      gap: 7px;
      white-space: nowrap;
      font-size: .78rem;
      font-weight: 700;
    }

    .gallery {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      grid-auto-flow: row;
      grid-auto-rows: 8px;
      gap: var(--gap);
      padding: var(--gap);
      align-items: start;
    }

    .gallery-card {
      position: relative;
      display: block;
      width: 100%;
      margin: 0;
      overflow: hidden;
      background: #111;
      cursor: pointer;
      break-inside: avoid;
    }

    .gallery-card[hidden] { display: none; }

    .gallery-card img {
      display: block;
      width: 100%;
      height: auto;
      min-height: 180px;
      object-fit: cover;
      transition: transform .35s ease, filter .35s ease;
    }

    .gallery-card:hover img {
      transform: scale(1.018);
      filter: brightness(.92);
    }

    .card-overlay {
      position: absolute;
      inset: auto 0 0;
      min-height: 70px;
      padding: 20px 16px;
      background: rgba(0, 80, 106, 0.78);
      opacity: 0;
      transform: translateY(10px);
      transition: opacity .25s ease, transform .25s ease, background-color .25s ease;
      pointer-events: none;
      backdrop-filter: blur(2px);
    }

    .gallery-card:hover .card-overlay,
    .gallery-card:focus-visible .card-overlay {
      opacity: 1;
      transform: translateY(0);
      background: rgba(0, 103, 135, 0.82);
    }

    .card-title {
      margin: 0;
      font-size: 1rem;
      line-height: 1.25;
    }

    .card-category {
      margin-top: 4px;
      color: #d2d2d2;
      font-size: .76rem;
      text-transform: uppercase;
      letter-spacing: .08em;
    }

    .empty-state {
      display: none;
      padding: 60px 20px;
      color: var(--muted);
      text-align: center;
    }

    .lightbox {
      position: fixed;
      inset: 0;
      z-index: 100;
      display: none;
      place-items: center;
      padding: 22px;
      background: rgba(0, 0, 0, .94);
    }

    .lightbox.open { display: grid; }

    .lightbox-dialog {
      position: relative;
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(250px, 340px);
      width: min(1400px, 100%);
      max-height: 92vh;
      background: #111;
      border: 1px solid #333;
      overflow: hidden;
    }

    .lightbox-image-wrap {
      display: grid;
      place-items: center;
      min-height: 55vh;
      background: #050505;
    }

    .lightbox-image {
      display: block;
      width: 100%;
      height: 100%;
      max-height: 92vh;
      object-fit: contain;
    }

    .lightbox-copy {
      padding: 26px 24px;
      overflow-y: auto;
    }

    .lightbox-copy h2 {
      margin: 0 38px 8px 0;
      font-size: 1.45rem;
      line-height: 1.2;
    }

    .lightbox-copy .category {
      margin-bottom: 22px;
      color: var(--muted);
      font-size: .8rem;
      text-transform: uppercase;
      letter-spacing: .1em;
    }

    .lightbox-copy pre {
      margin: 0;
      color: #d3d3d3;
      font: .92rem/1.65 Arial, Helvetica, sans-serif;
      white-space: pre-wrap;
    }

    .close-button {
      position: absolute;
      top: 10px;
      right: 12px;
      z-index: 2;
      width: 38px;
      height: 38px;
      color: white;
      background: rgba(0,0,0,.62);
      border: 1px solid #666;
      cursor: pointer;
      font-size: 1.45rem;
      line-height: 1;
    }

    @media (max-width: 1200px) {
      .gallery { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    }

    @media (max-width: 800px) {
      .utility-row {
        align-items: stretch;
        flex-direction: column;
      }

      .sort-controls { justify-content: flex-end; }

      .gallery { grid-template-columns: repeat(2, minmax(0, 1fr)); }

      .lightbox {
        padding: 8px;
        overflow-y: auto;
      }

      .lightbox-dialog {
        display: block;
        max-height: none;
      }

      .lightbox-image-wrap { min-height: 0; }

      .lightbox-image {
        width: 100%;
        height: auto;
        max-height: 70vh;
      }
    }

    @media (max-width: 480px) {
      .gallery {
        grid-template-columns: 1fr;
        padding: 8px;
      }

      .filter-button, .sort-button {
        font-size: .72rem;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        scroll-behavior: auto !important;
        transition: none !important;
      }
    }

    :focus-visible { outline: 2px solid #8dcbea; outline-offset: 4px; }
    button, .viewer-toolbar a { min-height: 44px; }
    .category-picker summary { display: none; cursor: pointer; }
    .gallery-count { margin: 0; color: var(--muted); font-size: .8rem; }
    .gallery-card { border: 0; padding: 0; text-align: left; color: inherit; }
    .gallery-card img { min-height: 0; }
    .card-title { overflow-wrap: anywhere; }
    .lightbox {
      width: 100%; max-width: none; height: 100dvh; max-height: none;
      margin: 0; border: 0; color: var(--text); overflow: auto;
      background: rgba(0, 0, 0, .96);
    }
    .lightbox[open] { display: grid; }
    .lightbox::backdrop { background: rgba(0, 0, 0, .94); }
    .lightbox-dialog { grid-template-columns: minmax(0, 1fr) minmax(280px, 370px); }
    .image-panel { min-width: 0; background: #050505; }
    .viewer-toolbar {
      display: flex; align-items: center; flex-wrap: wrap; gap: 8px;
      padding: 12px; border-bottom: 1px solid #292929;
    }
    .viewer-toolbar button, .viewer-toolbar a {
      display: inline-flex; align-items: center; justify-content: center;
      background: #171717; border: 1px solid #555; color: var(--text);
      padding: 8px 12px; text-decoration: none; cursor: pointer; font-size: .85rem;
    }
    .viewer-toolbar button:disabled { opacity: .4; cursor: default; }
    .viewer-toolbar .image-position { margin-right: auto; color: var(--muted); font-size: .8rem; }
    .lightbox-image-wrap {
      display: block; place-items: normal; position: relative; height: min(72vh, 850px); min-height: 0;
      overflow: hidden; touch-action: pan-y pinch-zoom;
    }
    .lightbox-image { height: 100%; max-height: none; cursor: zoom-in; }
    .lightbox-image-wrap.zoomed { overflow: auto; touch-action: auto; }
    .zoomed .lightbox-image { max-width: none; height: auto; cursor: grab; }
    .zoomed.dragging .lightbox-image { cursor: grabbing; }
    .lightbox-copy { padding-top: 58px; }
    .lightbox-copy h2 { margin-right: 0; font-size: 1.3rem; }
    .lightbox-copy .category { margin-bottom: 14px; }
    .description { color: #ddd; line-height: 1.6; }
    .exposure-summary { font-size: 1.1rem; line-height: 1.55; color: #a8d6ef; }
    .exposure-summary small { display: block; font-size: .85rem; color: var(--muted); }
    .image-facts { font-size: .9rem; line-height: 1.6; }
    .image-facts p { margin: 8px 0; }
    .capture-details { border-top: 1px solid #333; padding-top: 14px; margin-top: 18px; }
    .capture-details summary { cursor: pointer; padding: 8px 0; }
    .capture-details pre { padding-top: 12px; font-size: .85rem; }
    .viewer-help { color: var(--muted); font-size: .78rem; line-height: 1.5; }
    .share-link { width: 100%; padding: 8px; background: #222; color: white; border: 1px solid #666; }
    .share-status { min-height: 1.5em; color: var(--muted); font-size: .8rem; }
    @media (max-width: 800px) {
      .controls { padding: 8px 12px; }
      .category-picker summary { display: block; padding: 10px 0; font-size: .85rem; }
      .category-picker .filter-row { display: none; padding-bottom: 8px; }
      .category-picker[open] .filter-row { display: flex; }
      .utility-row { flex-direction: row; align-items: center; gap: 8px; margin-top: 4px; }
      .search { width: 100%; min-width: 0; }
      .sort-controls > span { display: none; }
      .gallery-count { display: none; }
      .lightbox { padding: 8px; align-items: start; }
      .lightbox-dialog { max-height: none; margin: auto; }
      .lightbox-image-wrap { height: 55dvh; }
      .lightbox-image { height: 100%; max-height: none; }
      .lightbox-copy { padding: 20px; }
      .viewer-toolbar { padding-right: 56px; gap: 6px; }
      .viewer-toolbar button, .viewer-toolbar a { padding: 8px 10px; }
      .card-overlay { opacity: 1; transform: none; min-height: 0; padding: 30px 12px 12px; background: linear-gradient(transparent, rgba(0,0,0,.86)); }
      .card-title { font-size: .9rem; }
    }
    @media (hover: none) {
      .card-overlay { opacity: 1; transform: none; background: linear-gradient(transparent, rgba(0,0,0,.86)); }
    }
  </style>
</head>

<body>
  <header class="site-header">
    <h1>Amir Shapour Mohammadi</h1>
    <a class="home-link" href="https://amirshapourmohammadi.com/">Home</a>
  </header>

  <section class="controls" aria-label="Gallery controls">
    <details id="categoryPicker" class="category-picker" open>
      <summary id="categorySummary">Categories · View All</summary>
      <div id="filters" class="filter-row"></div>
    </details>

    <div class="utility-row">
      <input
        id="search"
        class="search"
        type="search"
        placeholder="Search images..."
        autocomplete="off"
        aria-label="Search images"
      >

      <div class="sort-controls" aria-label="Sort images">
        <span>Sort by:</span>
        <button class="sort-button active" data-sort="rank" type="button" aria-pressed="true">Featured</button>
        <button class="sort-button" data-sort="date" type="button" aria-pressed="false">Newest</button>
      </div>
      <p id="galleryCount" class="gallery-count" role="status"></p>
    </div>
  </section>

  <main>
    <section id="gallery" class="gallery" aria-live="polite"></section>
    <p id="emptyState" class="empty-state">No images match your filters.</p>
  </main>

  <dialog id="lightbox" class="lightbox" aria-labelledby="lightboxTitle">
    <article class="lightbox-dialog">
      <button id="closeLightbox" class="close-button" type="button" aria-label="Close image">×</button>
      <div class="image-panel">
        <nav class="viewer-toolbar" aria-label="Image viewer controls">
          <button id="previousImage" type="button" aria-label="Previous image">←</button>
          <span id="imagePosition" class="image-position"></span>
          <button id="nextImage" type="button" aria-label="Next image">→</button>
          <button id="zoomImage" type="button" aria-pressed="false">Zoom in</button>
          <a id="originalImage" target="_blank" rel="noopener">Original ↗</a>
        </nav>
        <div id="imageViewport" class="lightbox-image-wrap">
          <img id="lightboxImage" class="lightbox-image" alt="" draggable="false">
        </div>
      </div>
      <div class="lightbox-copy">
        <h2 id="lightboxTitle"></h2>
        <div id="lightboxCategory" class="category"></div>
        <p id="imageDescription" class="description"></p>
        <p id="exposureSummary" class="exposure-summary"></p>
        <div id="imageFacts" class="image-facts"></div>
        <details id="captureDetails" class="capture-details">
          <summary>Capture details</summary>
          <pre id="lightboxDetails"></pre>
        </details>
        <div class="viewer-toolbar">
          <button id="shareImage" type="button">Copy image link</button>
        </div>
        <input id="shareLink" class="share-link" aria-label="Image link" readonly hidden>
        <p id="shareStatus" class="share-status" role="status"></p>
        <p class="viewer-help">Use ← → or swipe to browse. Zoom in to explore; drag or scroll to move around. Press Escape to close.</p>
      </div>
    </article>
  </dialog>

// Stable links are independent of titles and filenames.
    // Curated opening six; the remaining images retain their relative ranks.
    const featuredIds = ["whirlpool", "horsehead-flame", "dumbbell", "andromeda", "pinwheel", "orion-running-man"];
    const gallery = document.getElementById("gallery");
    const filters = document.getElementById("filters");
    const search = document.getElementById("search");
    const lightbox = document.getElementById("lightbox");
    const lightboxImage = document.getElementById("lightboxImage");
    const viewport = document.getElementById("imageViewport");
    const closeButton = document.getElementById("closeLightbox");
    const zoomButton = document.getElementById("zoomImage");
    const picker = document.getElementById("categoryPicker");
    const mobile = matchMedia("(max-width: 800px)");
    let activeCategory = "View All";
    let activeSort = "rank";
    let currentItem = null;
    let viewerItems = [];
    let lastFocusedCard = null;
    let zoomed = false;
    let gesture = null;
    let suppressImageClick = false;

    const categoryOrder = ["Emission Nebula", "Reflection Nebula", "Planetary Nebula", "Galaxy", "Galaxy Cluster", "Globular Cluster", "Solar System", "Wide-field"];
    const categories = ["View All", ...categoryOrder.filter(category => imageData.some(item => item.category === category))];
    const byId = new Map(imageData.map(item => [item.id, item]));
    const aliases = { horsehead: "horsehead-flame", orion: "orion-running-man", m51: "whirlpool", m101: "pinwheel", m63: "sunflower" };

    function featuredRank(item) {
      const index = featuredIds.indexOf(item.id);
      return index < 0 ? featuredIds.length + item.rank : index;
    }

    function visibleItems() {
      const query = search.value.trim().toLowerCase().replace(/\s+/g, "");
      return imageData
        .filter(item => activeCategory === "View All" || item.category === activeCategory)
        .filter(item => [item.title, item.objects, item.description, item.category, item.details].join(" ").toLowerCase().replace(/\s+/g, "").includes(query))
        .sort((a, b) => activeSort === "date"
          ? (b.date || "").localeCompare(a.date || "") || featuredRank(a) - featuredRank(b)
          : featuredRank(a) - featuredRank(b));
    }

    function setCategory(category) {
      activeCategory = category;
      filters.querySelectorAll("button").forEach(button => {
        const selected = button.dataset.category === category;
        button.classList.toggle("active", selected);
        button.setAttribute("aria-pressed", String(selected));
      });
      document.getElementById("categorySummary").textContent = "Categories · " + category;
      if (mobile.matches) picker.open = false;
      renderGallery();
    }

    categories.forEach(category => {
      const button = document.createElement("button");
      button.type = "button";
      button.className = "filter-button";
      button.textContent = category;
      button.dataset.category = category;
      button.addEventListener("click", () => setCategory(category));
      filters.append(button);
    });
    function syncPicker() { picker.open = !mobile.matches; }
    mobile.addEventListener("change", syncPicker);
    syncPicker();

    function thumbnailPath(src) { return src.replace("./astro/", "./astro_thumbnails/"); }

    function resizeCard(card) {
      const image = card.querySelector("img");
      if (!image.complete || !image.naturalWidth) return;
      const style = getComputedStyle(gallery);
      const row = parseFloat(style.gridAutoRows);
      const gap = parseFloat(style.rowGap);
      card.style.gridRowEnd = "span " + Math.ceil((image.getBoundingClientRect().height + gap) / (row + gap));
    }

    function renderGallery() {
      const items = visibleItems();
      gallery.replaceChildren();
      for (const [index, item] of items.entries()) {
        const card = document.createElement("button");
        card.type = "button";
        card.className = "gallery-card";
        card.dataset.imageId = item.id;
        card.setAttribute("aria-label", "Open " + item.title);
        const image = document.createElement("img");
        image.src = thumbnailPath(item.src);
        image.alt = item.title;
        image.loading = index < 8 ? "eager" : "lazy";
        image.fetchPriority = index < 4 ? "high" : "auto";
        image.decoding = "async";
        image.addEventListener("error", () => { image.src = item.src; }, {once: true});
        image.addEventListener("load", () => resizeCard(card));
        const overlay = document.createElement("span");
        overlay.className = "card-overlay";
        const title = document.createElement("span");
        title.className = "card-title";
        title.style.display = "block";
        title.textContent = item.title;
        const category = document.createElement("span");
        category.className = "card-category";
        category.style.display = "block";
        category.textContent = item.category;
        overlay.append(title, category);
        card.append(image, overlay);
        card.addEventListener("click", () => {
          lastFocusedCard = card;
          viewerItems = visibleItems();
          history.pushState({astroViewer: true}, "", "#" + item.id);
          showImage(item);
        });
        gallery.append(card);
        requestAnimationFrame(() => resizeCard(card));
      }
      document.getElementById("emptyState").style.display = items.length ? "none" : "block";
      document.getElementById("galleryCount").textContent = items.length + " of " + imageData.length + " images";
    }

    function exposureInfo(details) {
      const raw = details.match(/^Subs: (.+)$/m)?.[1];
      if (!raw) return null;
      // Only calculate totals from complete, unambiguous count × seconds records.
      const parts = raw.split(" + ");
      if (!parts.every(part => /^\d+x\d+(?:\.\d+)?$/.test(part))) {
        return {total: "", frames: raw.replace(/(\d+)x(\d+)/g, "$1 × $2 s").replace(" (?)", " (unverified)")};
      }
      const seconds = parts.reduce((sum, part) => {
        const [count, length] = part.split("x").map(Number);
        return sum + count * length;
      }, 0);
      const h = Math.floor(seconds / 3600), m = Math.floor(seconds % 3600 / 60), s = seconds % 60;
      const total = [h && h + (h === 1 ? " hour" : " hours"), m && m + (m === 1 ? " minute" : " minutes"), s && s + " seconds"].filter(Boolean).join(" ");
      return {total, frames: parts.map(part => part.replace("x", " × ") + " s").join(" + ")};
    }

    function resetZoom() {
      zoomed = false;
      viewport.classList.remove("zoomed", "dragging");
      lightboxImage.style.width = "";
      viewport.scrollTo(0, 0);
      zoomButton.textContent = "Zoom in";
      zoomButton.setAttribute("aria-pressed", "false");
    }

    function toggleZoom() {
      if (!lightboxImage.complete || !lightboxImage.naturalWidth) return;
      if (zoomed) { resetZoom(); return; }
      zoomed = true;
      viewport.classList.add("zoomed");
      lightboxImage.style.width = Math.max(lightboxImage.naturalWidth, viewport.clientWidth * 2) + "px";
      viewport.scrollTo((lightboxImage.clientWidth - viewport.clientWidth) / 2, (lightboxImage.clientHeight - viewport.clientHeight) / 2);
      zoomButton.textContent = "Fit image";
      zoomButton.setAttribute("aria-pressed", "true");
    }

    function showImage(item) {
      const opening = !lightbox.open;
      currentItem = item;
      if (!viewerItems.some(image => image.id === item.id)) viewerItems = [...imageData].sort((a,b) => featuredRank(a) - featuredRank(b));
      resetZoom();
      zoomButton.disabled = true;
      lightboxImage.src = item.src;
      lightboxImage.alt = item.title;
      document.getElementById("originalImage").href = item.src;
      document.getElementById("lightboxTitle").textContent = item.title;
      document.getElementById("lightboxCategory").textContent = item.category;
      document.getElementById("imageDescription").textContent = item.description;
      document.getElementById("lightboxDetails").textContent = item.details;
      document.getElementById("captureDetails").open = false;
      const summary = document.getElementById("exposureSummary");
      const exposure = exposureInfo(item.details);
      summary.replaceChildren();
      if (exposure) {
        summary.textContent = exposure.total ? exposure.total + " of exposure" : "Exposure: " + exposure.frames;
        if (exposure.total) {
          const frames = document.createElement("small");
          frames.textContent = exposure.frames;
          summary.append(frames);
        }
      }
      summary.hidden = !exposure;
      const facts = document.getElementById("imageFacts");
      facts.replaceChildren();
      const rows = item.details.split("\n").filter(row => /^(Date|Scope|Lens|Filter|Distance|Constellation|Capture details):/.test(row));
      if (item.objects) rows.unshift("In this image: " + item.objects);
      for (const row of rows) {
        const p = document.createElement("p");
        const split = row.indexOf(":");
        const label = document.createElement("strong");
        label.textContent = row.slice(0, split + 1) + " ";
        p.append(label, row.slice(split + 1).trim());
        facts.append(p);
      }
      document.getElementById("imagePosition").textContent = (viewerItems.indexOf(item) + 1) + " / " + viewerItems.length;
      document.getElementById("previousImage").disabled = viewerItems.length < 2;
      document.getElementById("nextImage").disabled = viewerItems.length < 2;
      document.getElementById("shareLink").hidden = true;
      document.getElementById("shareStatus").textContent = "";
      document.title = item.title + " | Amir Shapour Mohammadi";
      if (opening) {
        document.body.style.overflow = "hidden";
        lightbox.showModal(); // Native modal makes the background inert.
        closeButton.focus();
      }
      lightbox.scrollTop = 0;
      document.querySelector(".lightbox-copy").scrollTop = 0;
    }

    function dismissViewer() {
      if (!lightbox.open) return;
      lightbox.close();
      resetZoom();
      lightboxImage.removeAttribute("src");
      currentItem = null;
      document.body.style.overflow = "";
      document.title = "Astrophotography | Amir Shapour Mohammadi";
      (lastFocusedCard?.isConnected ? lastFocusedCard : search).focus({preventScroll: true});
    }

    function closeViewer() {
      if (history.state?.astroViewer) {
        history.back();
      } else {
        history.replaceState(history.state, "", location.pathname + location.search);
        dismissViewer();
      }
    }

    function followHash() {
      let id;
      try { id = decodeURIComponent(location.hash.slice(1)); } catch { dismissViewer(); return; }
      const item = byId.get(aliases[id] || id);
      if (item) showImage(item);
      else dismissViewer();
    }

    function navigateImage(direction) {
      if (!currentItem || viewerItems.length < 2) return;
      const index = (viewerItems.indexOf(currentItem) + direction + viewerItems.length) % viewerItems.length;
      const item = viewerItems[index];
      history.replaceState(history.state, "", "#" + item.id);
      showImage(item);
    }

    lightboxImage.addEventListener("load", () => { zoomButton.disabled = false; });
    lightboxImage.addEventListener("error", () => {
      zoomButton.disabled = true;
      document.getElementById("shareStatus").textContent = "This image could not load. Try reopening it.";
    });
    closeButton.addEventListener("click", closeViewer);
    lightbox.addEventListener("cancel", event => { event.preventDefault(); closeViewer(); });
    lightbox.addEventListener("click", event => { if (event.target === lightbox) closeViewer(); });
    document.getElementById("previousImage").addEventListener("click", () => navigateImage(-1));
    document.getElementById("nextImage").addEventListener("click", () => navigateImage(1));
    zoomButton.addEventListener("click", toggleZoom);
    lightboxImage.addEventListener("click", () => { if (!suppressImageClick) toggleZoom(); suppressImageClick = false; });
    lightbox.addEventListener("keydown", event => {
      if (event.key === "Tab") {
        const controls = [...lightbox.querySelectorAll("button:not(:disabled), a[href], summary, input:not(:disabled)")]
          .filter(element => element.getClientRects().length > 0);
        const first = controls[0], last = controls[controls.length - 1];
        if (event.shiftKey && document.activeElement === first) {
          event.preventDefault();
          last.focus();
        } else if (!event.shiftKey && document.activeElement === last) {
          event.preventDefault();
          first.focus();
        }
        return;
      }
      if (event.target.matches("input, textarea") || event.altKey || event.ctrlKey || event.metaKey || zoomed) return;
      if (event.key === "ArrowLeft" || event.key === "ArrowRight") {
        event.preventDefault();
        navigateImage(event.key === "ArrowLeft" ? -1 : 1);
      }
    });

    viewport.addEventListener("pointerdown", event => {
      if (!event.isPrimary) { gesture = null; return; }
      suppressImageClick = false;
      gesture = {id: event.pointerId, x: event.clientX, y: event.clientY, left: viewport.scrollLeft, top: viewport.scrollTop, time: performance.now(), mouse: event.pointerType === "mouse"};
      if (zoomed && gesture.mouse) {
        event.preventDefault();
        viewport.setPointerCapture(event.pointerId);
        viewport.classList.add("dragging");
      }
    });
    viewport.addEventListener("pointermove", event => {
      if (!gesture || event.pointerId !== gesture.id) return;
      if (zoomed && gesture.mouse) {
        const dx = event.clientX - gesture.x, dy = event.clientY - gesture.y;
        if (Math.abs(dx) + Math.abs(dy) > 8) suppressImageClick = true;
        viewport.scrollTo(gesture.left - dx, gesture.top - dy);
      }
    });
    viewport.addEventListener("pointerup", event => {
      if (!gesture || event.pointerId !== gesture.id) return;
      const dx = event.clientX - gesture.x, dy = event.clientY - gesture.y;
      if (!zoomed && !gesture.mouse && Math.abs(dx) > 55 && Math.abs(dx) > Math.abs(dy) * 1.5 && performance.now() - gesture.time < 1200) {
        suppressImageClick = true;
        navigateImage(dx < 0 ? 1 : -1);
      }
      viewport.classList.remove("dragging");
      gesture = null;
    });
    viewport.addEventListener("pointercancel", () => { gesture = null; suppressImageClick = true; viewport.classList.remove("dragging"); });

    document.getElementById("shareImage").addEventListener("click", async () => {
      const sharedItem = currentItem;
      const url = new URL(location.href);
      url.hash = sharedItem.id;
      url.search = "";
      try {
        await navigator.clipboard.writeText(url.href);
        if (currentItem === sharedItem) document.getElementById("shareStatus").textContent = "Image link copied.";
      } catch {
        if (currentItem !== sharedItem) return;
        const field = document.getElementById("shareLink");
        field.value = url.href;
        field.hidden = false;
        field.focus();
        field.select();
        document.getElementById("shareStatus").textContent = "Copy the selected link.";
      }
    });

    search.addEventListener("input", renderGallery);
    document.querySelectorAll(".sort-button").forEach(button => {
      button.addEventListener("click", () => {
        activeSort = button.dataset.sort;
        document.querySelectorAll(".sort-button").forEach(other => {
          other.classList.toggle("active", other === button);
          other.setAttribute("aria-pressed", String(other === button));
        });
        renderGallery();
      });
    });
    let resizeTimer;
    window.addEventListener("resize", () => {
      clearTimeout(resizeTimer);
      resizeTimer = setTimeout(() => gallery.querySelectorAll(".gallery-card").forEach(resizeCard), 100);
    });
    window.addEventListener("hashchange", followHash);
    setCategory("View All");
    followHash();
  </script>
